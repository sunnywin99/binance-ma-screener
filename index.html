<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>USDT 幣種 MA 多頭排列篩選器</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131824;
    --border: #232a3a;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #3ecf8e;
    --danger: #ef5b5b;
    --header-bg: #171d2b;
    --row-hover: #1b2231;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --border: #e3e6ec;
      --text: #1a1d24;
      --muted: #6b7280;
      --accent: #0f9d63;
      --danger: #d3382f;
      --header-bg: #f0f2f6;
      --row-hover: #f5f7fb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.6; }
  .controls {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  button {
    background: var(--accent); color: #05130c; border: none;
    padding: 10px 18px; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { color: var(--muted); font-size: 0.88rem; }
  .progress-bar {
    width: 100%; height: 6px; background: var(--border); border-radius: 4px;
    overflow: hidden; margin: 8px 0 16px; display: none;
  }
  .progress-bar.active { display: block; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.15s; }
  table {
    width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    font-variant-numeric: tabular-nums;
  }
  thead th {
    background: var(--header-bg); text-align: right; padding: 10px 14px;
    font-size: 0.82rem; color: var(--muted); font-weight: 600;
    border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
    white-space: nowrap;
  }
  thead th:first-child, thead th:nth-child(2) { text-align: left; }
  tbody td {
    padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--border);
    font-size: 0.9rem; white-space: nowrap;
  }
  tbody td:first-child, tbody td:nth-child(2) { text-align: left; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: none; }
  .symbol { font-weight: 600; }
  .rank { color: var(--muted); width: 40px; }
  .pos { color: var(--accent); }
  .empty, .error {
    padding: 40px 20px; text-align: center; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  }
  .error { color: var(--danger); }
  footer { margin-top: 20px; color: var(--muted); font-size: 0.78rem; text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>USDT 幣種 MA 多頭排列篩選器</h1>
  <div class="sub">
    掃描幣安（Binance）現貨所有 USDT 交易對的日K線，篩選出均線多頭排列（MA50 &gt; MA150 &gt; MA200）的幣種。
    資料在你按下「開始掃描」時，即時從幣安公開 API 抓取，不會儲存在任何伺服器上。
  </div>
  <div class="controls">
    <button id="scanBtn">開始掃描</button>
    <span class="status" id="status">尚未掃描</span>
  </div>
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <div id="resultArea"></div>
  <footer>
    資料來源：Binance 公開 API（api.binance.com）。僅供研究參考，非投資建議。
  </footer>
</div>

<script>
const BASE = "https://api.binance.com";
const scanBtn = document.getElementById("scanBtn");
const statusEl = document.getElementById("status");
const progressBar = document.getElementById("progressBar");
const progressFill = document.getElementById("progressFill");
const resultArea = document.getElementById("resultArea");

let lastResults = [];
let sortKey = "symbol";
let sortDir = 1;

async function fetchJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status + " for " + url);
  return res.json();
}

async function getUsdtSymbols() {
  const info = await fetchJson(BASE + "/api/v3/exchangeInfo");
  return info.symbols
    .filter(s =>
      s.quoteAsset === "USDT" &&
      s.status === "TRADING" &&
      s.isSpotTradingAllowed
    )
    .map(s => s.symbol);
}

function average(arr) {
  return arr.reduce((a, b) => a + b, 0) / arr.length;
}

async function analyzeSymbol(symbol) {
  const klines = await fetchJson(
    `${BASE}/api/v3/klines?symbol=${symbol}&interval=1d&limit=201`
  );
  const now = Date.now();
  // 只取已收盤的K棒，排除當日尚未走完的那一根
  const closed = klines.filter(k => k[6] < now);
  if (closed.length < 200) return null;

  const closes = closed.map(k => parseFloat(k[4]));
  const ma50 = average(closes.slice(-50));
  const ma150 = average(closes.slice(-150));
  const ma200 = average(closes.slice(-200));
  const price = closes[closes.length - 1];

  if (!(ma50 > ma150 && ma150 > ma200)) return null;

  return {
    symbol,
    price,
    ma50,
    ma150,
    ma200,
    strength: (ma50 - ma200) / ma200, // MA50 領先 MA200 的幅度，作為排列強度指標
  };
}

// 簡單併發池，避免同時發出過多請求
async function runPool(items, worker, concurrency, onProgress) {
  const results = [];
  let idx = 0;
  let done = 0;
  async function next() {
    while (idx < items.length) {
      const i = idx++;
      try {
        const r = await worker(items[i]);
        if (r) results.push(r);
      } catch (e) {
        // 單一幣種失敗就跳過，不中斷整體掃描
      }
      done++;
      onProgress(done, items.length);
    }
  }
  const workers = Array.from({ length: concurrency }, next);
  await Promise.all(workers);
  return results;
}

function formatPrice(v) {
  if (v >= 100) return v.toFixed(2);
  if (v >= 1) return v.toFixed(4);
  return v.toPrecision(4);
}

function renderTable() {
  if (lastResults.length === 0) {
    resultArea.innerHTML = `<div class="empty">目前沒有符合 MA50 &gt; MA150 &gt; MA200 多頭排列的 USDT 幣種。</div>`;
    return;
  }
  const sorted = [...lastResults].sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (typeof av === "string") return av.localeCompare(bv) * sortDir;
    return (av - bv) * sortDir;
  });
  const rows = sorted.map((r, i) => `
    <tr>
      <td class="rank">${i + 1}</td>
      <td class="symbol">${r.symbol}</td>
      <td>${formatPrice(r.price)}</td>
      <td>${formatPrice(r.ma50)}</td>
      <td>${formatPrice(r.ma150)}</td>
      <td>${formatPrice(r.ma200)}</td>
      <td class="pos">+${(r.strength * 100).toFixed(2)}%</td>
    </tr>
  `).join("");

  resultArea.innerHTML = `
    <table>
      <thead>
        <tr>
          <th class="rank">#</th>
          <th data-key="symbol">幣種</th>
          <th data-key="price">現價</th>
          <th data-key="ma50">MA50</th>
          <th data-key="ma150">MA150</th>
          <th data-key="ma200">MA200</th>
          <th data-key="strength">MA50 領先 MA200</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;

  resultArea.querySelectorAll("th[data-key]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1;
      else { sortKey = key; sortDir = -1; }
      renderTable();
    });
  });
}

async function runScan() {
  scanBtn.disabled = true;
  progressBar.classList.add("active");
  progressFill.style.width = "0%";
  resultArea.innerHTML = "";
  statusEl.textContent = "正在取得所有 USDT 交易對清單...";

  try {
    const symbols = await getUsdtSymbols();
    statusEl.textContent = `共 ${symbols.length} 個 USDT 幣種，開始抓取日K並計算均線...`;

    lastResults = await runPool(symbols, analyzeSymbol, 8, (done, total) => {
      const pct = Math.round((done / total) * 100);
      progressFill.style.width = pct + "%";
      statusEl.textContent = `掃描中... ${done}/${total}`;
    });

    statusEl.textContent = `掃描完成：共 ${symbols.length} 檔，符合多頭排列 ${lastResults.length} 檔`;
    renderTable();
  } catch (e) {
    resultArea.innerHTML = `<div class="error">掃描失敗：${e.message}</div>`;
    statusEl.textContent = "發生錯誤";
  } finally {
    progressBar.classList.remove("active");
    scanBtn.disabled = false;
  }
}

scanBtn.addEventListener("click", runScan);
</script>
</body>
</html>
